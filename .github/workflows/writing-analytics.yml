name: Writing Analytics

on:
  pull_request:
    paths:
      - "articles/**"
      - "ideas/backlog.md"
      - "ideas/published.md"
      - "data/metrics/**"
      - "data/exports/**"
      - "config/portfolio-export.yml"
      - "templates/article.md"
      - "scripts/writing_analytics.py"
      - "scripts/writing_dashboard.py"
      - "scripts/writing_opportunities.py"
      - "scripts/writing_portfolio_export.py"
      - "scripts/migrations/**"
      - "tests/**"
      - "docs/WRITING_ANALYTICS.md"
      - "docs/CONTENT_OPPORTUNITIES.md"
      - "docs/PORTFOLIO_EXPORT.md"
      - "docs/PORTFOLIO_EXPORT_SCHEMA_V1.md"
      - "reports/visual-dashboard.md"
      - "reports/content-opportunities.md"
      - "reports/assets/**"
      - "requirements.txt"
      - ".github/workflows/writing-analytics.yml"
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "ideas/backlog.md"
      - "ideas/published.md"
      - "data/metrics/**"
      - "data/exports/**"
      - "config/portfolio-export.yml"
      - "templates/article.md"
      - "scripts/writing_analytics.py"
      - "scripts/writing_dashboard.py"
      - "scripts/writing_opportunities.py"
      - "scripts/writing_portfolio_export.py"
      - "scripts/migrations/**"
      - "tests/**"
      - "docs/WRITING_ANALYTICS.md"
      - "docs/CONTENT_OPPORTUNITIES.md"
      - "docs/PORTFOLIO_EXPORT.md"
      - "docs/PORTFOLIO_EXPORT_SCHEMA_V1.md"
      - "reports/visual-dashboard.md"
      - "reports/content-opportunities.md"
      - "reports/assets/**"
      - "requirements.txt"
      - ".github/workflows/writing-analytics.yml"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: writing-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate curated metadata migration
        run: python scripts/migrations/20260827_normalize_published_metadata.py --check
      - name: Validate article metadata and analytics rendering
        run: python scripts/writing_analytics.py --check
      - name: Validate content opportunity rendering
        run: python scripts/writing_opportunities.py --check
      - name: Validate public portfolio export
        run: python scripts/writing_portfolio_export.py --check
      - name: Validate visual dashboard rendering
        run: python scripts/writing_dashboard.py --check
      - name: Exercise external metric adapters (best effort)
        continue-on-error: true
        run: python scripts/writing_analytics.py --refresh-metrics --check

  refresh:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
      - name: Normalize pre-analytics published metadata
        run: python scripts/migrations/20260827_normalize_published_metadata.py
      - name: Refresh metrics and generated profile
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: python scripts/writing_analytics.py --refresh-metrics
      - name: Refresh content opportunities
        run: python scripts/writing_opportunities.py
      - name: Refresh public portfolio export
        run: python scripts/writing_portfolio_export.py
      - name: Refresh visual dashboard
        run: python scripts/writing_dashboard.py
      - name: Commit analytics and metadata when changed
        run: |
          if [ -z "$(git status --porcelain -- articles README.md reports/writing-profile.md reports/visual-dashboard.md reports/content-opportunities.md reports/assets data/metrics data/exports)" ]; then
            echo "No analytics or metadata changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles README.md reports/writing-profile.md reports/visual-dashboard.md reports/content-opportunities.md reports/assets data/metrics data/exports
          git commit -m "chore: normalize metadata and refresh writing analytics"
          git push
