name: Writing Analytics

on:
  pull_request:
    paths:
      - "README.md"
      - "articles/**"
      - "ideas/backlog.md"
      - "ideas/published.md"
      - "metadata/platform-native-analytics.yml"
      - "data/metrics/**"
      - "data/github-funnel/**"
      - "data/analytics/**"
      - "data/exports/**"
      - "config/portfolio-export.yml"
      - "config/github-writing-funnel.yml"
      - "templates/article.md"
      - "scripts/writing_analytics.py"
      - "scripts/writing_analytics_pipeline.py"
      - "scripts/writing_catalog.py"
      - "scripts/writing_data_mart.py"
      - "scripts/writing_data_mart_funnel.py"
      - "scripts/writing_freshness.py"
      - "scripts/writing_funnel.py"
      - "scripts/writing_dashboard.py"
      - "scripts/writing_decision_dashboard.py"
      - "scripts/writing_decision_dashboard_funnel.py"
      - "scripts/writing_opportunities.py"
      - "scripts/writing_opportunities_funnel.py"
      - "scripts/writing_portfolio_export.py"
      - "scripts/migrations/**"
      - "tests/**"
      - "docs/WRITING_ANALYTICS.md"
      - "docs/ANALYTICS_DATA_MART.md"
      - "docs/SOURCE_FRESHNESS.md"
      - "docs/GITHUB_WRITING_FUNNEL.md"
      - "docs/CONTENT_OPPORTUNITIES.md"
      - "docs/PORTFOLIO_EXPORT.md"
      - "docs/PORTFOLIO_EXPORT_SCHEMA_V1.md"
      - "reports/visual-dashboard.md"
      - "reports/content-opportunities.md"
      - "reports/assets/**"
      - "requirements.txt"
      - ".github/workflows/writing-analytics.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "articles/**"
      - "ideas/backlog.md"
      - "ideas/published.md"
      - "metadata/platform-native-analytics.yml"
      - "data/metrics/**"
      - "data/github-funnel/**"
      - "data/analytics/**"
      - "data/exports/**"
      - "config/portfolio-export.yml"
      - "config/github-writing-funnel.yml"
      - "templates/article.md"
      - "scripts/writing_analytics.py"
      - "scripts/writing_analytics_pipeline.py"
      - "scripts/writing_catalog.py"
      - "scripts/writing_data_mart.py"
      - "scripts/writing_data_mart_funnel.py"
      - "scripts/writing_freshness.py"
      - "scripts/writing_funnel.py"
      - "scripts/writing_dashboard.py"
      - "scripts/writing_decision_dashboard.py"
      - "scripts/writing_decision_dashboard_funnel.py"
      - "scripts/writing_opportunities.py"
      - "scripts/writing_opportunities_funnel.py"
      - "scripts/writing_portfolio_export.py"
      - "scripts/migrations/**"
      - "tests/**"
      - "docs/WRITING_ANALYTICS.md"
      - "docs/ANALYTICS_DATA_MART.md"
      - "docs/SOURCE_FRESHNESS.md"
      - "docs/GITHUB_WRITING_FUNNEL.md"
      - "docs/CONTENT_OPPORTUNITIES.md"
      - "docs/PORTFOLIO_EXPORT.md"
      - "docs/PORTFOLIO_EXPORT_SCHEMA_V1.md"
      - "reports/visual-dashboard.md"
      - "reports/content-opportunities.md"
      - "reports/assets/**"
      - "requirements.txt"
      - ".github/workflows/writing-analytics.yml"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: tech-writing-main-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate curated metadata migration
        run: python scripts/migrations/20260827_normalize_published_metadata.py --check
      - name: Validate unified article universe and analytics rendering
        run: python scripts/writing_analytics_pipeline.py --check
      - name: Validate GitHub writing funnel policy and stored snapshots
        run: python scripts/writing_funnel.py --check
      - name: Validate content opportunity rendering with GitHub funnel
        run: python scripts/writing_opportunities_funnel.py --check
      - name: Validate normalized analytics data mart, source freshness, and GitHub funnel
        run: python scripts/writing_data_mart_funnel.py --check
      - name: Validate public portfolio export
        run: python scripts/writing_portfolio_export.py --check
      - name: Validate decision dashboard rendering with GitHub funnel
        run: python scripts/writing_decision_dashboard_funnel.py --check
      - name: Exercise external metric adapters (best effort)
        continue-on-error: true
        run: python scripts/writing_analytics_pipeline.py --refresh-metrics --check

  refresh:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analytics unit tests
        run: python -m unittest discover -s tests -v
      - name: Normalize pre-analytics published metadata
        run: python scripts/migrations/20260827_normalize_published_metadata.py
      - name: Refresh GitHub writing funnel snapshot (best effort)
        continue-on-error: true
        run: python scripts/writing_funnel.py --refresh
      - name: Refresh metrics and generated profile
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: python scripts/writing_analytics_pipeline.py --refresh-metrics
      - name: Refresh content opportunities with GitHub funnel
        run: python scripts/writing_opportunities_funnel.py
      - name: Refresh normalized analytics data mart, source freshness, and GitHub funnel
        run: python scripts/writing_data_mart_funnel.py
      - name: Refresh public portfolio export
        run: python scripts/writing_portfolio_export.py
      - name: Refresh decision dashboard with GitHub funnel
        run: python scripts/writing_decision_dashboard_funnel.py
      - name: Commit analytics and metadata when changed
        run: |
          if [ -z "$(git status --porcelain -- articles README.md reports/writing-profile.md reports/visual-dashboard.md reports/content-opportunities.md reports/assets data/metrics data/github-funnel data/analytics data/exports)" ]; then
            echo "No analytics or metadata changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles README.md reports/writing-profile.md reports/visual-dashboard.md reports/content-opportunities.md reports/assets data/metrics data/github-funnel data/analytics data/exports
          git commit -m "chore: normalize metadata and refresh writing analytics"
          git push
