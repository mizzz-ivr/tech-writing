name: Publish Qiita articles

on:
  push:
    branches:
      - main
    paths:
      - "public/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-writing-main-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: increments/qiita-cli/actions/publish@fd520c132ab8149fe5c8f5c947469e4f89281845 # v1.10.0
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
          commit-message: "chore(qiita): update published article metadata"
