<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="脆弱性解説図"><rect width="1440" height="810" fill="#f7faff"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif"><text x="65" y="91" font-size="46" font-weight="800" fill="#102647" text-anchor="start">PHP 2026年10月：RCEに至る仕組み（概念図）</text><text x="65" y="135" font-size="21" font-weight="500" fill="#507195" text-anchor="start">PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 で修正</text><line x1="65" y1="163" x2="1375" y2="163" stroke="#c9dcf4" stroke-width="4" stroke-linecap="round"/><text x="65" y="218" font-size="31" font-weight="800" fill="#d8384b" text-anchor="start">CVE-2026-109618</text><rect x="66" y="255" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="86" y="294" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">01</text><text x="86" y="329" font-size="23" font-weight="500" fill="#142849" text-anchor="start">HTTPリクエスト</text><text x="86" y="366" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">外部入力がPHPに到達</text><text x="372" y="340" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="408" y="255" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="428" y="294" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">02</text><text x="428" y="329" font-size="23" font-weight="500" fill="#142849" text-anchor="start">メモリ上限処理</text><text x="428" y="366" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">OOMの中断が発生</text><text x="714" y="340" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="750" y="255" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="770" y="294" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">03</text><text x="770" y="329" font-size="23" font-weight="500" fill="#142849" text-anchor="start">不完全な状態</text><text x="770" y="366" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">解放時に不整合</text><text x="1056" y="340" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="1092" y="255" width="297" height="144" rx="18" fill="#fff0f2" stroke="#f5c0c8" stroke-width="2"/><text x="1112" y="294" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">04</text><text x="1112" y="329" font-size="23" font-weight="500" fill="#142849" text-anchor="start">深刻な結果</text><text x="1112" y="366" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">条件次第で任意コード実行</text><text x="65" y="482" font-size="31" font-weight="800" fill="#d8384b" text-anchor="start">CVE-2026-109619</text><rect x="66" y="519" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="86" y="558" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">01</text><text x="86" y="593" font-size="22" font-weight="500" fill="#142849" text-anchor="start">以前のリクエスト</text><text x="86" y="630" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">内部状態を保持</text><text x="372" y="604" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="408" y="519" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="428" y="558" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">02</text><text x="428" y="593" font-size="22" font-weight="500" fill="#142849" text-anchor="start">異常終了など</text><text x="428" y="630" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">メモリが解放される</text><text x="714" y="604" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="750" y="519" width="297" height="144" rx="18" fill="#ffffff" stroke="#dce7f2" stroke-width="2"/><text x="770" y="558" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">03</text><text x="770" y="593" font-size="22" font-weight="500" fill="#142849" text-anchor="start">古い状態を参照</text><text x="770" y="630" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">次の処理で不整合</text><text x="1056" y="604" font-size="28" font-weight="800" fill="#5f9dc4" text-anchor="start">→</text><rect x="1092" y="519" width="297" height="144" rx="18" fill="#fff0f2" stroke="#f5c0c8" stroke-width="2"/><text x="1112" y="558" font-size="22" font-weight="800" fill="#3279b4" text-anchor="start">04</text><text x="1112" y="593" font-size="22" font-weight="500" fill="#142849" text-anchor="start">深刻な結果</text><text x="1112" y="630" font-size="18" font-weight="500" fill="#56718e" text-anchor="start">条件次第で任意コード実行</text><rect x="65" y="706" width="1310" height="83" rx="12" fill="#e8f4ff" stroke="#d5e8f9" stroke-width="2"/><text x="91" y="746" font-size="22" font-weight="700" fill="#184e86" text-anchor="start">重要：入力バリデーションやWAFだけで完全には防げない。</text><text x="91" y="774" font-size="18" font-weight="500" fill="#486987" text-anchor="start">PHP公式は「完全な緩和策はない」と説明。修正版への更新と侵害調査が必要。</text></g></svg>