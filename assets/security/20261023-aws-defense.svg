<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="脆弱性解説図"><rect width="1440" height="810" fill="#f7faff"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif"><text x="65" y="91" font-size="46" font-weight="800" fill="#102647" text-anchor="start">AWS・クラウドでもアプリの脆弱性対応は必要</text><text x="65" y="135" font-size="21" font-weight="500" fill="#507195" text-anchor="start">共有責任モデルを「実際の作業」に落とす</text><line x1="65" y1="163" x2="1375" y2="163" stroke="#c9dcf4" stroke-width="4" stroke-linecap="round"/><rect x="65" y="194" width="1310" height="169" rx="18" fill="#eaf4ff" stroke="#cee0f5" stroke-width="2"/><text x="92" y="236" font-size="24" font-weight="700" fill="#1f5a91" text-anchor="start">リクエストの通り道</text><rect x="93" y="263" width="218" height="70" rx="11" fill="#fff" stroke="#c5d8ef" stroke-width="2"/><text x="202" y="290" font-size="19" font-weight="700" fill="#133964" text-anchor="middle">Internet</text><text x="202" y="318" font-size="16" font-weight="500" fill="#5f7890" text-anchor="middle">アクセス</text><text x="317" y="307" font-size="25" font-weight="800" fill="#5189c0" text-anchor="start">→</text><rect x="348" y="263" width="218" height="70" rx="11" fill="#fff" stroke="#c5d8ef" stroke-width="2"/><text x="457" y="290" font-size="19" font-weight="700" fill="#133964" text-anchor="middle">CloudFront / WAF</text><text x="457" y="318" font-size="16" font-weight="500" fill="#5f7890" text-anchor="middle">入口の防御</text><text x="572" y="307" font-size="25" font-weight="800" fill="#5189c0" text-anchor="start">→</text><rect x="603" y="263" width="218" height="70" rx="11" fill="#fff" stroke="#c5d8ef" stroke-width="2"/><text x="712" y="290" font-size="19" font-weight="700" fill="#133964" text-anchor="middle">ALB / API</text><text x="712" y="318" font-size="16" font-weight="500" fill="#5f7890" text-anchor="middle">負荷分散</text><text x="827" y="307" font-size="25" font-weight="800" fill="#5189c0" text-anchor="start">→</text><rect x="858" y="263" width="218" height="70" rx="11" fill="#fff" stroke="#c5d8ef" stroke-width="2"/><text x="967" y="290" font-size="19" font-weight="700" fill="#133964" text-anchor="middle">EC2 / ECS / EKS</text><text x="967" y="318" font-size="16" font-weight="500" fill="#5f7890" text-anchor="middle">PHP・Javaが動く</text><text x="1082" y="307" font-size="25" font-weight="800" fill="#5189c0" text-anchor="start">→</text><rect x="1113" y="263" width="218" height="70" rx="11" fill="#fff" stroke="#c5d8ef" stroke-width="2"/><text x="1222" y="290" font-size="19" font-weight="700" fill="#133964" text-anchor="middle">DB / S3</text><text x="1222" y="318" font-size="16" font-weight="500" fill="#5f7890" text-anchor="middle">保存先</text><text x="67" y="413" font-size="28" font-weight="800" fill="#102647" text-anchor="start">役割ごとの対応</text><rect x="65" y="439" width="410" height="235" rx="18" fill="#fff" stroke="#dbe6f5" stroke-width="2"/><rect x="82" y="455" width="376" height="55" rx="10" fill="#eff6ff" stroke="#eff6ff" stroke-width="2"/><text x="96" y="490" font-size="24" font-weight="800" fill="#1a4e88" text-anchor="start">開発・アプリ運用</text><text x="93" y="545" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="123" y="545" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">PHP / Tomcat / Springの版を把握</text><text x="93" y="587" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="123" y="587" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">依存関係と実行イメージを更新</text><text x="93" y="629" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="123" y="629" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">回帰テスト・安全な再デプロイ</text><rect x="515" y="439" width="410" height="235" rx="18" fill="#fff" stroke="#dbe6f5" stroke-width="2"/><rect x="532" y="455" width="376" height="55" rx="10" fill="#eff6ff" stroke="#eff6ff" stroke-width="2"/><text x="546" y="490" font-size="24" font-weight="800" fill="#1a4e88" text-anchor="start">クラウド・SRE</text><text x="543" y="545" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="573" y="545" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">EC2 / ECS / EKSの資産を棚卸し</text><text x="543" y="587" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="573" y="587" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">公開範囲・権限・通信経路を点検</text><text x="543" y="629" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="573" y="629" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">ログ監視・隔離・復旧を準備</text><rect x="965" y="439" width="410" height="235" rx="18" fill="#fff" stroke="#dbe6f5" stroke-width="2"/><rect x="982" y="455" width="376" height="55" rx="10" fill="#eff6ff" stroke="#eff6ff" stroke-width="2"/><text x="996" y="490" font-size="24" font-weight="800" fill="#1a4e88" text-anchor="start">セキュリティ・管理</text><text x="993" y="545" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="1023" y="545" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">CVE / CVSS / KEVを定点確認</text><text x="993" y="587" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="1023" y="587" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">環境依存の優先順位・期限を決定</text><text x="993" y="629" font-size="22" font-weight="800" fill="#10a5a0" text-anchor="start">✓</text><text x="1023" y="629" font-size="19" font-weight="500" fill="#263d58" text-anchor="start">証跡保全・インシデント判断</text><rect x="65" y="710" width="1310" height="76" rx="12" fill="#fff2ed" stroke="#ffddd0" stroke-width="2"/><text x="96" y="742" font-size="19" font-weight="700" fill="#9c4626" text-anchor="start">WAFは補完策。マネージドサービスでも、利用者が管理するアプリ・依存ライブラリの更新責任は残る。</text><text x="96" y="773" font-size="18" font-weight="500" fill="#8a5e52" text-anchor="start">実際の責任分界はサービス形態（EC2 / ECS / Lambda / PaaS等）により異なる。</text></g></svg>